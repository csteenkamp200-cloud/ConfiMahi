; ============================================================
; UE Dumper - Game Profiles
; Place this file next to Dumper.exe
;
; Format:
;   [ExeNameWithoutExtension]
;   UE               = 4.27      ; UE version string (sets IsUE5 if "5.x")
;   IsUE5            = false     ; override UE5 mode explicitly
;   FNameReversed    = false     ; set true if FName layout is {Number, ComparisonIndex}
;   <Struct>.<Field> = 0xHEX     ; memory offsets
;   GObjects.Sig     = XX XX ??  ; IDA-style hex, ?? = wildcard
;   GObjects.PtrOffset = -4      ; signed byte offset from match to rel32
;   GObjects.PtrExtra  = 3       ; bytes after rel32 in RIP calculation
;   GNames.Sig       = ...
;   GNames.PtrOffset = ...
;   GNames.PtrExtra  = ...
; ============================================================

; -----------------------------------------------------------------------
; Hogwarts Legacy (UE4.27, compact GObjects)
; -----------------------------------------------------------------------
[HogwartsLegacy-Win64-Shipping]
UE                       = 4.27
FNameEntry.HeaderSize    = 0x2
UObject.Index            = 0xC
UObject.Class            = 0x10
UObject.Name             = 0x18
UObject.Outer            = 0x20
UField.Next              = 0x28
UStruct.SuperStruct      = 0x30
UStruct.Children         = 0x38
UStruct.PropertiesSize   = 0x40
UEnum.Names              = 0x40
UEnum.NamesElementSize   = 0x10
UFunction.FunctionFlags  = 0x88
UFunction.Func           = 0xB0
UProperty.ArrayDim       = 0x38
UProperty.ElementSize    = 0x3E
UProperty.PropertyFlags  = 0x30
UProperty.Offset         = 0x4C
UProperty.Size           = 0x70
GObjects.Sig             = 4C 8B 0D ?? ?? ?? ?? 4C 8B C3
GObjects.PtrOffset       = -4
GObjects.PtrExtra        = 3
GNames.Sig               = 48 89 1D ?? ?? ?? ?? 48 8B 5C 24 20 48 83 C4 28
GNames.PtrOffset         = 4
GNames.PtrExtra          = 3

